<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0603" />
  <meta name="description" content="Escribe tus problemas o quejas del mundo y deja que se consuman en la hoguera." />
  <title>La Hoguera</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <canvas id="fire" class="fire" aria-hidden="true"></canvas>

  <main class="stage">
    <h1 class="legend">Escribe aquí tus problemas o quejas del mundo y deja que se consuma... en la hoguera</h1>

    <form class="panel" id="burn-form" autocomplete="off" novalidate>
      <label class="sr-only" for="message">Tu mensaje</label>
      <textarea
        id="message"
        class="message"
        name="message"
        rows="3"
        placeholder="Escribe lo que quieres dejar ir…"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="sentences"></textarea>

      <button type="button" class="burn-btn" id="burn-btn">
        <span>Lanzar a la hoguera</span>
        <span class="flame-ico" aria-hidden="true">🔥</span>
      </button>
    </form>
  </main>

  <div class="flight-layer" id="flight-layer" aria-hidden="true"></div>

  <p class="burn-count" id="burn-count" role="status" aria-live="polite" aria-atomic="true">
    <span class="burn-count__mark" aria-hidden="true">🔥</span>
    <span class="burn-count__num" id="burn-count-num">0</span>
    <span class="sr-only"> problemas quemados en esta sesión</span>
  </p>

  <script src="js/app.js"></script>
</body>
</html>
